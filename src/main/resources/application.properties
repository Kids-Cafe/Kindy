spring.application.name=kindy

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.kidscafe.kindy.dto

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Voice messages arrive here as recordings. The 1MB default cut them off mid-sentence, and the
# request cap has to move with the file cap or the multipart envelope is what fails instead.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Origins allowed to call the API with session cookies. Comma-separated; the dev server is the
# default. Cookies mean the origins must be listed exactly — "*" is not permitted with credentials.
#
# In production the SPA ships inside this JAR and is served from the same origin, so this list is
# really a development concession to the Vite server. CorsConfig and CsrfFilter both read it, so
# an origin trusted to make cross-origin calls is exactly an origin trusted to POST — one list,
# two enforcement points, no way for them to drift apart.
kindy.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Session cookie hardening.
#
# `same-site=lax` is load-bearing for OAuth, not just a default worth stating: the provider sends
# the browser back to /api/user/oauth/{provider}/callback as a top-level GET navigation from
# kauth.kakao.com (etc.), and that request MUST carry the session holding the CSRF state we are
# about to verify. Lax sends cookies on top-level GETs, so it works; `strict` would withhold the
# cookie and turn every social login into a bogus INVALID_STATE. Do not "tighten" this to strict.
#
# `secure` is off by default so local development over plain http keeps working. It MUST be true
# in production — a Secure cookie is simply not sent over http, so this is the one setting that
# silently logs everybody out if the deployment terminates TLS somewhere unexpected.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

kindy.stt.url=${STT_URL}
kindy.llm.url=${LLM_URL}
kindy.llm.model=${LLM_MODEL}
kindy.llm.prompt=${LLM_PROMPT:}
# The diary writer. It reads a day of a child's conversation and answers with one JSON object, so
# it needs its own prompt; `format` is Ollama's structured-output switch — blank it for a server
# that has no such field (an OpenAI-compatible endpoint rejects the request on an unknown member).
kindy.llm.diary.prompt=${LLM_DIARY_PROMPT:}
kindy.llm.diary.format=${LLM_DIARY_FORMAT:json}
# The report writer. One prompt shared by all five categories, with {category}, {schema} and
# {rules} filled in per category — the schema is the frontend's type restated, so it stays in code
# rather than here. `format` as above.
kindy.llm.report.prompt=${LLM_REPORT_PROMPT:}
kindy.llm.report.format=${LLM_REPORT_FORMAT:json}
kindy.tts.url=${TTS_URL}
kindy.sts.url=${STS_URL}
kindy.sts.model=${STS_MODEL}
# Per-character voice models. Unset means both partners use the shared model above and differ only
# by speed and pitch (see ChatDTO.Partner).
kindy.sts.model.kio=${STS_MODEL_KIO:}
kindy.sts.model.kina=${STS_MODEL_KINA:}
kindy.encrypt.key=${AES_KEY}
kindy.encrypt.salt=${SALT}

# Social login. A provider with no client id/secret is simply unavailable — the login endpoint
# answers NOT_AVAILABLE rather than half-working. Nothing here creates accounts: signing up is
# still email and password, and a provider is a second way into an account that already exists.
#
# Where the provider sends the browser back. It must byte-match what is registered in each
# provider's console — they compare it as a string, so a trailing slash is a different value.
# Production: https://kindies.kr/api/user/oauth/{provider}/callback
kindy.oauth.redirect-uri=${OAUTH_REDIRECT_URI:http://localhost:8080/api/user/oauth/{provider}/callback}
# Where we send the browser afterwards — a route of the SPA. In production the SPA is served by
# this same application, so this is the same origin.
kindy.oauth.return-uri=${OAUTH_RETURN_URI:http://localhost:5173/oauth/callback}
kindy.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
kindy.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kindy.oauth.naver.client-id=${NAVER_CLIENT_ID:}
kindy.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
kindy.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
kindy.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}