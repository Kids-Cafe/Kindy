spring.application.name=kindy

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.kidscafe.kindy.dto

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Voice messages arrive here as recordings. The 1MB default cut them off mid-sentence, and the
# request cap has to move with the file cap or the multipart envelope is what fails instead.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Origins allowed to call the API with session cookies. Comma-separated; the dev server is the
# default. Cookies mean the origins must be listed exactly — "*" is not permitted with credentials.
kindy.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

kindy.stt.url=${STT_URL}
kindy.llm.url=${LLM_URL}
kindy.llm.model=${LLM_MODEL}
kindy.llm.prompt=${LLM_PROMPT:}
# The diary writer. It reads a day of a child's conversation and answers with one JSON object, so
# it needs its own prompt; `format` is Ollama's structured-output switch — blank it for a server
# that has no such field (an OpenAI-compatible endpoint rejects the request on an unknown member).
kindy.llm.diary.prompt=${LLM_DIARY_PROMPT:}
kindy.llm.diary.format=${LLM_DIARY_FORMAT:json}
# The report writer. One prompt shared by all five categories, with {category}, {schema} and
# {rules} filled in per category — the schema is the frontend's type restated, so it stays in code
# rather than here. `format` as above.
kindy.llm.report.prompt=${LLM_REPORT_PROMPT:}
kindy.llm.report.format=${LLM_REPORT_FORMAT:json}
kindy.tts.url=${TTS_URL}
kindy.sts.url=${STS_URL}
kindy.sts.model=${STS_MODEL}
# Per-character voice models. Unset means both partners use the shared model above and differ only
# by speed and pitch (see ChatDTO.Partner).
kindy.sts.model.kio=${STS_MODEL_KIO:}
kindy.sts.model.kina=${STS_MODEL_KINA:}
kindy.encrypt.key=${AES_KEY}
kindy.encrypt.salt=${SALT}