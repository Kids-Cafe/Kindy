spring.application.name=kindy

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.kidscafe.kindy.dto

# The port this application listens on.
#
# Named `PORT` because that is the variable a platform hands you rather than one you choose: Heroku,
# Railway, Cloud Run and App Runner all inject it and route to whatever it names, so an application
# that ignores it binds a port nothing forwards to and reads as down. The 8080 default is what
# Spring would have used anyway, so a deployment that sets nothing keeps the behaviour it has.
#
# Changing this in development does NOT move the OAuth callback: kindy.oauth.redirect-uri below has
# its own hardcoded 8080 default, and that value must byte-match what each provider's console has on
# file, so it cannot be made to follow this one. Set both, or neither.
server.port=${PORT:8080}

# The database. There is no unconfigured version of this one — every endpoint reaches a MyBatis
# mapper, so an application that cannot reach a database cannot answer anything at all.
#
# The URL defaults to a local MariaDB because that is what somebody who has just cloned this
# repository is running. The credentials deliberately do not have defaults: a default password is a
# password that eventually reaches production, and being refused by MariaDB for an empty user is a
# much better failure than quietly connecting as root.
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/kindy}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Outbound mail, used for exactly one thing: the signup verification code.
#
# Blank credentials mean no mail. UserService already catches the send failure and returns null,
# which the controller turns into UNKNOWN_ERROR, so an unconfigured deployment runs and only
# signup-by-email stops working — the same bargain as an unconfigured social provider below.
#
# Host and port are variables rather than Gmail literals so a deployment can point at its own relay.
# Moving to STARTTLS on 587 also needs SMTP_SSL_ENABLE=false: 465 is implicit TLS from the first
# byte and 587 negotiates it mid-conversation, so the two flags are not interchangeable. `ssl.trust`
# follows SMTP_HOST on purpose — left as a literal it would go on vouching for Gmail's certificate
# while talking to somebody else.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:smtp.gmail.com}

# Voice messages arrive here as recordings, and so do photos. The 1MB default cut recordings off
# mid-sentence, and the request cap has to move with the file cap or the multipart envelope is what
# fails instead. Note the frontend refuses photos over 8MB before sending, so the gap between the
# two limits is deliberate slack for the multipart envelope rather than headroom for bigger photos.
#
# Tunable for a deployment behind a proxy carrying its own body limit, which would otherwise reject
# a large upload before it ever reached this application. Lowering the file cap below the frontend's
# 8MB does not stop big photos so much as move where they are refused: the browser sends one it
# believes is acceptable and this end rejects it. Raise the proxy instead, wherever that is possible.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}

# Where uploaded photos live.
#
# S3 with Block All Public Access left on. Nothing in the bucket is ever handed to a browser
# directly and nothing is presigned: the only way to a photo is GET /api/class/photo/raw, which
# re-checks the same canViewClass the rest of the class API uses and then streams the object. That
# is what makes deleting a photo take effect at once, and a link forwarded to somebody who has left
# the kindergarten worthless — a presigned URL stays good for its whole lifetime regardless of both.
#
# Leave `bucket` blank and photos go to a directory on this machine instead, reached through the
# same endpoint and the same permission check. This application has to run with no AWS account at
# all, the same way an unconfigured social provider answers NOT_AVAILABLE rather than half-working.
# Blank rather than absent, matching kindy.oauth.*.client-id.
#
# T_PHOTO.URL holds the *object key* — class/12/2026/08/<uuid>.jpg — and not a URL. The key is
# identical in both modes, so moving a local deployment to S3 is a bulk copy of the directory into
# the bucket with nothing to rewrite in the database.
kindy.storage.s3.bucket=${S3_BUCKET:}
kindy.storage.s3.region=${S3_REGION:ap-northeast-2}
# Prefixed onto every key inside the bucket, so one bucket can hold more than one deployment. It is
# deliberately not part of the key stored in a row: changing it moves objects, not rows.
kindy.storage.s3.key-prefix=${S3_KEY_PREFIX:}
kindy.storage.local.dir=${STORAGE_LOCAL_DIR:./data/photos}

# Origins allowed to call the API with session cookies. Comma-separated; the dev server is the
# default. Cookies mean the origins must be listed exactly — "*" is not permitted with credentials.
#
# In production the SPA ships inside this JAR and is served from the same origin, so this list is
# really a development concession to the Vite server. CorsConfig and CsrfFilter both read it, so
# an origin trusted to make cross-origin calls is exactly an origin trusted to POST — one list,
# two enforcement points, no way for them to drift apart.
kindy.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Session cookie hardening.
#
# `same-site=lax` is load-bearing for OAuth, not just a default worth stating: the provider sends
# the browser back to /api/user/oauth/{provider}/callback as a top-level GET navigation from
# kauth.kakao.com (etc.), and that request MUST carry the session holding the CSRF state we are
# about to verify. Lax sends cookies on top-level GETs, so it works; `strict` would withhold the
# cookie and turn every social login into a bogus INVALID_STATE. Do not "tighten" this to strict.
#
# `secure` is off by default so local development over plain http keeps working. It MUST be true
# in production — a Secure cookie is simply not sent over http, so this is the one setting that
# silently logs everybody out if the deployment terminates TLS somewhere unexpected.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# The speech and language services.
#
# All five are blank by default, and blank means not configured: the endpoint behind it answers
# NOT_AVAILABLE instead of attempting a call, exactly as an unconfigured social provider does. None
# of them is reachable from a fresh checkout, and requiring all five to start the application meant
# nobody could run it — or the context-loading test — without standing up a model server first.
#
# Blank rather than absent, matching kindy.oauth.*.client-id and kindy.storage.s3.bucket. Note the
# consequence for code reading these: the property is always *present*, so a @Value default is dead
# text and the check has to be isBlank() (see ChatService.systemPrompt for the same trap).
#
# The model names, voices, languages and keys need no such check — they travel in a request body
# that is never sent when the URL beside them is blank: ChatService checks the URL before it builds
# a request at all, and now before it mints a credential either.

# The Google Cloud service account that Speech-to-Text and Text-to-Speech are billed to, used only
# by the `google` dialects below.
#
# This is NOT the same Google as kindy.oauth.google.* at the bottom of this file. That one signs a
# parent in and its client id is public by design. This one spends money, and the JSON key file it
# names must never be committed, baked into an image layer, or put anywhere inside this repository.
#
# Blank is the ordinary case and does not mean "no speech". Left blank, GoogleTokenProvider falls
# back to Application Default Credentials — the metadata server on Cloud Run, GCE and GKE, where
# there is no key file to leak at all, and `gcloud auth application-default login` on a developer
# machine. Set it only where a key file is the only option, and to a path outside the checkout.
#
# No credentials at all is not a startup failure and not a reason to refuse to boot. Nothing is read
# until the first transcription or synthesis that actually needs it, and then it is a
# ServiceUnavailableException: /api/chat/transcribe answers NOT_AVAILABLE and /api/chat/speak answers
# 503, exactly as a blank URL does. Both APIs authorize with an OAuth2 bearer scoped to
# cloud-platform and NEITHER accepts an API key, which is the one place the language model's "change
# three variables, change provider" bargain does not reach.
kindy.google.credentials=${GOOGLE_APPLICATION_CREDENTIALS:}

# Speech-to-text.
#
# `dialect` picks the shape of the request, and it is a setting rather than something inferred from
# the URL: the hostname does carry the answer, but a rule that guesses it sends the wrong body to a
# proxy or to any gateway not on a Google hostname, and fails as a 400 from the far end instead of as
# a value somebody can read. An unrecognised value is read as openai — a typo should degrade to the
# portable dialect, not take speech down.
#
#   openai  POST <url>/v1/audio/transcriptions, multipart — whisper.cpp, faster-whisper, OpenAI,
#           Groq, LM Studio. This is the default, and it is byte-for-byte the request this
#           application has always sent, so an existing deployment changes nothing.
#   google  STT_URL=https://speech.googleapis.com/v1/speech:recognize
#
# The Google path is the *synchronous* endpoint: 60 seconds of audio and 10 MB of request, inline.
# The recorder in the frontend stops at 20 seconds — 640 KB at 16 kHz mono 16-bit — so nothing this
# application sends is near either limit. Wanting longer recordings is not a bigger number here: it
# is speech:longrunningrecognize, an object in a bucket and a poll loop, none of which this has.
#
# The encoding and sample rate are deliberately NOT settings. The browser assembles the WAV itself —
# 16 kHz, mono, 16-bit LINEAR16 — because that is the only format this end has ever accepted, and the
# two repositories hand-mirror that contract. A property here would let a deployment disagree with
# the browser, and the symptom of disagreeing is not an error: it is a confident transcript of noise.
kindy.stt.url=${STT_URL:}
kindy.stt.dialect=${STT_DIALECT:openai}
# Sent as `Authorization: Bearer` when set, and not at all when blank — which is what a self-hosted
# whisper wants, and what OpenAI or Groq will not accept. The google dialect ignores this and uses
# the service account above. Same bargain as kindy.llm.key.
kindy.stt.key=${STT_KEY:}
# What language a child is expected to speak, for the google dialect. Required by that API and not
# guessable by it: the openai dialect sends `auto` and there is no such value here. ko-KR is what the
# partner answers in and what the recorder was built for. Behaviour worth knowing: on the google
# dialect, speech in another language is now transcribed as though it were Korean.
kindy.stt.language=${STT_LANGUAGE:ko-KR}
# Which recognition model, for the google dialect. Blank leaves the member off and Google uses its
# default, which is the right default here: which models exist differs by language, and naming one
# ko-KR does not have is a 400 on every single recording rather than a slightly worse transcript.
kindy.stt.model=${STT_MODEL:}

# The language model, spoken to in the OpenAI chat-completions dialect — one request shape for
# Gemini, OpenAI and a self-hosted Ollama alike, so changing provider is these three variables and
# no code. What comes back is read leniently either way (ChatDTO.LLMResponseDTO).
#
# Gemini, which is what this deployment uses:
#   LLM_URL=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
#   LLM_MODEL=gemini-2.5-flash
#   LLM_API_KEY=<https://aistudio.google.com/apikey>
#
# Ollama, for a deployment that goes back to a self-hosted model: the URL MUST be its
# OpenAI-compatible endpoint, http://<host>:11434/v1/chat/completions — NOT /api/chat. That older
# path speaks Ollama's own dialect, where structured output is a top-level `format` member; it
# answers 400 on the `response_format` we now send. Note which half that breaks: the diary and the
# report, not the chat turns, because only they ask for it.
kindy.llm.url=${LLM_URL:}
kindy.llm.model=${LLM_MODEL:}
# The bearer token for that endpoint. Blank means "send no Authorization header at all", which is
# what a local Ollama needs — an empty `Bearer ` is worse than nothing, refused where an anonymous
# request would have been served.
#
# It is attached per request in ChatService, never as a default header on the shared RestClient
# bean: OAuthService calls Kakao, Naver and Google through that same bean, and a default would hand
# them this key. It is kept off LLMQueryDTO for the same reason — that object is logged in full.
#
# Wrong or expired, the endpoint answers 401 and nothing a caller does will help, so it surfaces as
# NOT_AVAILABLE rather than GENERATION_FAILED: the same answer an unset LLM_URL gets, because it is
# the same kind of mistake and needs the same person to fix it.
kindy.llm.key=${LLM_API_KEY:}
kindy.llm.prompt=${LLM_PROMPT:}
# The diary writer. It reads a day of a child's conversation and answers with one JSON object, so
# it needs its own prompt; `format` is the structured-output switch — any non-blank value asks the
# server for `response_format: {"type":"json_object"}`, and blank leaves the member off entirely
# for a server that implements no such thing. It is a switch rather than a passthrough: the value
# is not forwarded, because json_object is the only mode Gemini, OpenAI and Ollama's /v1 endpoint
# agree on. Turning it off is survivable — the answer is still found with extractJson, which copes
# with a model that wraps its JSON in prose or a ``` fence — it just fails more often.
kindy.llm.diary.prompt=${LLM_DIARY_PROMPT:}
kindy.llm.diary.format=${LLM_DIARY_FORMAT:json}
# The report writer. One prompt shared by all five categories, with {category}, {schema} and
# {rules} filled in per category — the schema is the frontend's type restated, so it stays in code
# rather than here. `format` as above.
kindy.llm.report.prompt=${LLM_REPORT_PROMPT:}
kindy.llm.report.format=${LLM_REPORT_FORMAT:json}
# Text-to-speech. `dialect` as above, and the same reasoning.
#
#   openai  POST <url>/v1/audio/speech — {model, input, voice, speed, response_format:"wav"}, and the
#           audio itself comes back. OpenAI, openedai-speech, Kokoro-FastAPI, Speaches.
#   google  TTS_URL=https://texttospeech.googleapis.com/v1/text:synthesize
#
# ** UPGRADING: this is the one setting that breaks an existing deployment. ** The request this
# endpoint used to send was MeloTTS's own {text, language, speaker, speed}, which is not the OpenAI
# shape and is not anybody else's either. TTS_URL pointed straight at a MeloTTS /synthesize will now
# get a body it does not understand. MeloTTS is still perfectly usable — put a small adapter in front
# of it that accepts /v1/audio/speech — and in exchange the synthesis side is as portable as the
# transcription side instead of speaking a dialect exactly one project implements.
#
# Both dialects are asked for WAV: LINEAR16 for Google, response_format=wav for OpenAI. Unlike raw
# PCM that arrives with a header on it, so the bytes are a playable file that can be handed straight
# to voice conversion below. That is why the format is a constant in ChatService and not a setting:
# it is pinned to `produces = "audio/wav"` on both controller endpoints and to the .wav part name the
# converter is sent, and moving one of the three without the others is a silent mismatch, not an error.
kindy.tts.url=${TTS_URL:}
kindy.tts.dialect=${TTS_DIALECT:openai}
kindy.tts.key=${TTS_KEY:}
# Which model synthesizes, for the openai dialect (Google's names a voice, not a model). Blank leaves
# the member off, for a local server that serves one model and names none.
kindy.tts.model=${TTS_MODEL:}
# Must be the language of the voice named below. The google dialect requires it; the openai dialect
# has no language member and infers it from the text.
kindy.tts.language=${TTS_LANGUAGE:ko-KR}
# Which voice speaks. Blank leaves the member off and lets the server pick its default — which works,
# and is not promised to keep picking the same voice from one release to the next. A child's partner
# quietly changing voice is the kind of thing nobody files a bug about and everybody notices, so name
# one. For Google, to list them:
#
#   curl -H "Authorization: Bearer $(gcloud auth print-access-token)" \
#        "https://texttospeech.googleapis.com/v1/voices?languageCode=ko-KR"
#
# ko-KR-Standard-* is the cheapest; the Wavenet and Neural2 families sound better and cost more.
kindy.tts.voice=${TTS_VOICE:}
# Per-character voices, mirroring kindy.sts.model.kio/kina below: blank means "use the shared voice
# above", and the two partners then differ only by speaking rate (see ChatDTO.Partner) plus their
# pitch and voice model during conversion.
#
# These matter most for a deployment with no STS_URL, where nothing runs after synthesis at all: two
# different voices are then the only thing telling Kio and Kina apart by ear. Note that a character's
# pitch is NOT applied here — it belongs to conversion, and applying it in both places would
# transpose the same voice twice and make a chipmunk of whoever it was meant to flatter.
kindy.tts.voice.kio=${TTS_VOICE_KIO:}
kindy.tts.voice.kina=${TTS_VOICE_KINA:}

# Voice conversion, unchanged: still a self-hosted RVC-style server, still a multipart upload of the
# WAV synthesis produced, still `model_name` and `pitch_shift`. Google has no equivalent, which is
# why this one did not move. Blank means speech goes out as it was synthesized — /api/chat/speak
# falls back to exactly that on any conversion failure, and now does so without re-synthesizing.
kindy.sts.url=${STS_URL:}
kindy.sts.model=${STS_MODEL:}
# Per-character voice models. Unset means both partners use the shared model above and differ only
# by speed and pitch (see ChatDTO.Partner).
kindy.sts.model.kio=${STS_MODEL_KIO:}
kindy.sts.model.kina=${STS_MODEL_KINA:}

# The encryption key and the password pepper. Both are required, and neither can be given a default.
#
# They are bound to the data already stored: the pepper goes into every password hash and the key
# encrypts stored addresses, so a value that changes is a value that cannot read what the value
# before it wrote. That rules out generating one per boot — every account would fail to log in after
# a restart — and a constant written here would be a publicly known key protecting every deployment
# that forgot to override it. Being refused at startup is the only honest option left.
#
# AES_KEY must be 16, 24 or 32 bytes of UTF-8; EncryptUtil checks at startup rather than letting the
# first login be where a mistyped key is discovered.
kindy.encrypt.key=${AES_KEY}
kindy.encrypt.salt=${SALT}

# Social login. A provider with no client id/secret is simply unavailable — the login endpoint
# answers NOT_AVAILABLE rather than half-working. Nothing here creates accounts: signing up is
# still email and password, and a provider is a second way into an account that already exists.
#
# Where the provider sends the browser back. It must byte-match what is registered in each
# provider's console — they compare it as a string, so a trailing slash is a different value. That
# is also why the port here is a literal and does not follow server.port: the console has one
# specific string on file, and a value this end derives could disagree with it silently.
# Production: https://kindies.kr/api/user/oauth/{provider}/callback
kindy.oauth.redirect-uri=${OAUTH_REDIRECT_URI:http://localhost:8080/api/user/oauth/{provider}/callback}
# Where we send the browser afterwards — a route of the SPA. In production the SPA is served by
# this same application, so this is the same origin.
kindy.oauth.return-uri=${OAUTH_RETURN_URI:http://localhost:5173/oauth/callback}
kindy.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
kindy.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kindy.oauth.naver.client-id=${NAVER_CLIENT_ID:}
kindy.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
kindy.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
kindy.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
