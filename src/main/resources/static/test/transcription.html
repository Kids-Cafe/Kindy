<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Transcription Test</title>
        <script>
            async function recordAndTranscribe(durationMs = 5000) {
                const resultDiv = document.querySelector('#result');
                if (resultDiv) resultDiv.textContent = "Requesting microphone access...";

                try {
                    // 1. Request microphone access
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                    // 2. Set up AudioContext forced to 16000Hz (16kHz)
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                    const source = audioContext.createMediaStreamSource(stream);
                    const processor = audioContext.createScriptProcessor(4096, 1, 1);

                    const audioChunks = [];

                    // Collect raw PCM audio data samples
                    processor.onaudioprocess = (e) => {
                        const inputData = e.inputBuffer.getChannelData(0);
                        // Clone the float data chunks
                        audioChunks.push(new Float32Array(inputData));
                    };

                    source.connect(processor);
                    processor.connect(audioContext.destination);

                    if (resultDiv) resultDiv.textContent = `Recording for ${durationMs / 1000} seconds...`;

                    // 3. Wait for the recording duration to finish
                    await new Promise(resolve => setTimeout(resolve, durationMs));

                    // 4. Clean up and stop recording
                    stream.getTracks().forEach(track => track.stop());
                    source.disconnect();
                    processor.disconnect();
                    await audioContext.close();

                    if (resultDiv) resultDiv.textContent = "Processing audio into 16kHz WAV...";

                    // 5. Flatten the audio chunks into a single Float32Array
                    const totalLength = audioChunks.reduce((acc, chunk) => acc + chunk.length, 0);
                    const flattenedBuffer = new Float32Array(totalLength);
                    let offset = 0;
                    for (const chunk of audioChunks) {
                        flattenedBuffer.set(chunk, offset);
                        offset += chunk.length;
                    }

                    // 6. Encode into a 16-bit PCM WAV file buffer
                    const wavBuffer = encodeWAV(flattenedBuffer, 16000);
                    const audioBlob = new Blob([wavBuffer], { type: 'audio/wav' });

                    if (resultDiv) resultDiv.textContent = "Sending to server...";

                    // 7. Package into FormData matching your HTML setup
                    const formData = new FormData();
                    formData.append('file', audioBlob, 'recording.wav');

                    // 8. POST payload to your endpoint
                    const response = await fetch('./transcribe', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.text();
                    if (resultDiv) resultDiv.textContent = result;

                } catch (error) {
                    console.error("Transcription failed:", error);
                    if (resultDiv) resultDiv.textContent = `Error: ${error.message}`;
                }
            }

            // Helper function to build a valid 16-bit PCM WAV container
            function encodeWAV(samples, sampleRate) {
                const buffer = new ArrayBuffer(44 + samples.length * 2);
                const view = new DataView(buffer);

                /* RIFF identifier */
                writeString(view, 0, 'RIFF');
                /* file length */
                view.setUint32(4, 36 + samples.length * 2, true);
                /* RIFF type */
                writeString(view, 8, 'WAVE');
                /* format chunk identifier */
                writeString(view, 12, 'fmt ');
                /* format chunk length */
                view.setUint32(16, 16, true);
                /* sample format (raw PCM = 1) */
                view.setUint16(20, 1, true);
                /* channel count (1 = mono) */
                view.setUint16(22, 1, true);
                /* sample rate */
                view.setUint32(24, sampleRate, true);
                /* byte rate (sample rate * block align) */
                view.setUint32(28, sampleRate * 2, true);
                /* block align (channel count * bytes per sample) */
                view.setUint16(32, 2, true);
                /* bits per sample */
                view.setUint16(34, 16, true);
                /* data chunk identifier */
                writeString(view, 36, 'data');
                /* data chunk length */
                view.setUint32(40, samples.length * 2, true);

                // Float32 audio samples -> 16-bit Signed Integer PCM
                let index = 44;
                for (let i = 0; i < samples.length; i++) {
                    const s = Math.max(-1, Math.min(1, samples[i]));
                    view.setInt16(index, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                    index += 2;
                }

                return buffer;
            }

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            async function recordUntilSilence() {
                const resultDiv = document.querySelector('#result');
                if (resultDiv) resultDiv.textContent = "Requesting microphone access...";

                // --- CONFIGURATION PARAMETERS ---
                const CONF_THRESHOLD = 0.025;     // Volume threshold (0.00 to 1.00). Lower = more sensitive to soft speech.
                const CONF_SILENCE_MS = 1500;     // How long to wait (in milliseconds) before stopping after speech ends.
                const CONF_MIN_RECORD_MS = 1000;  // Minimum recording time to avoid accidental immediate cutoffs.
                // ---------------------------------

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                    // Force browser to downsample mic input to 16kHz
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                    const source = audioContext.createMediaStreamSource(stream);

                    // Analyser node lets us look at the audio volume in real-time
                    const analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    const bufferLength = analyser.frequencyBinCount;
                    const dataArray = new Float32Array(bufferLength);

                    // ScriptProcessor captures raw PCM chunks
                    const processor = audioContext.createScriptProcessor(4096, 1, 1);
                    const audioChunks = [];

                    processor.onaudioprocess = (e) => {
                        const inputData = e.inputBuffer.getChannelData(0);
                        audioChunks.push(new Float32Array(inputData));
                    };

                    // Connect the nodes together
                    source.connect(analyser);
                    analyser.connect(processor);
                    processor.connect(audioContext.destination);

                    if (resultDiv) resultDiv.textContent = "Listening... Start speaking.";

                    let lastSpeakingTime = Date.now();
                    let hasSpoken = false;
                    const startTime = Date.now();

                    // Check audio levels approximately 60 times a second using RequestAnimationFrame
                    await new Promise((resolve) => {
                        function checkAudio() {
                            analyser.getFloatTimeDomainData(dataArray);

                            // Calculate Root Mean Square (RMS) to find the volume level
                            let sumSquares = 0;
                            for (let i = 0; i < dataArray.length; i++) {
                                sumSquares += dataArray[i] * dataArray[i];
                            }
                            const rms = Math.sqrt(sumSquares / dataArray.length);

                            const now = Date.now();

                            if (rms > CONF_THRESHOLD) {
                                // Person is speaking
                                lastSpeakingTime = now;
                                hasSpoken = true;
                                if (resultDiv) resultDiv.textContent = "Recording your voice...";
                            } else {
                                // It is quiet right now. Check if they have stopped long enough
                                const durationRecorded = now - startTime;
                                const silenceDuration = now - lastSpeakingTime;

                                if (hasSpoken && silenceDuration > CONF_SILENCE_MS && durationRecorded > CONF_MIN_RECORD_MS) {
                                    if (resultDiv) resultDiv.textContent = "Detected silence. Stopping...";
                                    resolve(); // Break out of the promise loop to finalize and send
                                    return;
                                }
                            }

                            // Continue loop if not stopped
                            requestAnimationFrame(checkAudio);
                        }

                        // Kick off the loop
                        requestAnimationFrame(checkAudio);
                    });

                    // Clean up audio hardware
                    stream.getTracks().forEach(track => track.stop());
                    source.disconnect();
                    analyser.disconnect();
                    processor.disconnect();
                    await audioContext.close();

                    if (resultDiv) resultDiv.textContent = "Processing audio into 16kHz WAV...";

                    // Flatten chunks
                    const totalLength = audioChunks.reduce((acc, chunk) => acc + chunk.length, 0);
                    const flattenedBuffer = new Float32Array(totalLength);
                    let offset = 0;
                    for (const chunk of audioChunks) {
                        flattenedBuffer.set(chunk, offset);
                        offset += chunk.length;
                    }

                    // Build WAV file container
                    const wavBuffer = encodeWAV(flattenedBuffer, 16000);
                    const audioBlob = new Blob([wavBuffer], { type: 'audio/wav' });

                    if (resultDiv) resultDiv.textContent = "Sending to server...";

                    // Send to endpoint matching your initial form field layout
                    const formData = new FormData();
                    formData.append('file', audioBlob, 'recording.wav');

                    const response = await fetch('./transcribe', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.text();
                    if (resultDiv) resultDiv.textContent = result;

                } catch (error) {
                    console.error("Transcription failed:", error);
                    if (resultDiv) resultDiv.textContent = `Error: ${error.message}`;
                }
            }

            window.document.addEventListener('DOMContentLoaded', () => {
                window.document.querySelector('#requestRecord')?.addEventListener('click', recordUntilSilence)
            })

            window.document.addEventListener('submit', event => {
                event.preventDefault()
                const resultDiv = document.querySelector('#result')
                if (resultDiv) resultDiv.textContent = "Sending to server...";
                fetch('./transcribe', {
                    method: 'POST',
                    body: new FormData(event.target)
                }).then(response => response.text()).then(result => {
                    if (resultDiv) resultDiv.textContent = result
                })
            })
        </script>
    </head>
    <body>
        <h1>Transcription Test</h1>
        <hr />
        <input type="button" id="requestRecord" value="Record" />
        <hr />
        <form method="post" enctype="multipart/form-data" action="./transcribe">
            <input type="file" name="file" accept="audio/wav" />
            <input type="submit" />
        </form>
        <pre id="result"></pre>
    </body>
</html>
