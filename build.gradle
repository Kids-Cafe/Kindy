plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.kidscafe'
version = '0.0.1-SNAPSHOT'
description = 'kindy'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Photo storage. Pinned here because Spring Boot's BOM does not manage the AWS SDK, and deliberately
// not imported as the AWS BOM: two BOMs would overlap on io.netty, org.slf4j and org.reactivestreams,
// and which one wins becomes a resolution-order question nobody should have to think about.
def awsSdkVersion = '2.54.2'

// The credential half of Google Cloud Speech-to-Text and Text-to-Speech, and only the credential
// half: both are one JSON request each, sent over the RestClient bean this application already has.
// The single thing actually needed from Google is the one thing that cannot reasonably be
// hand-written — turning a service-account key into an OAuth2 access token and refreshing it before
// it expires. Neither API accepts an API key, so there is no simpler version of this; it is the one
// place the language model's "change three variables, change provider" bargain does not reach.
//
// Deliberately NOT google-cloud-speech / google-cloud-texttospeech. Those are full gRPC clients:
// they bring Netty, protobuf and a BOM of their own, and — exactly as recorded for the AWS SDK
// above — a second BOM overlapping on io.netty, org.slf4j and org.reactivestreams turns which
// version wins into a resolution-order question nobody should have to think about.
//
// What this coordinate actually drags in, checked rather than assumed
// (./gradlew dependencies --configuration runtimeClasspath): google-auth-library-credentials,
// google-http-client(-gson), gson, guava, opencensus-api(+contrib-http-util) and — the one that
// surprises — io.grpc:grpc-api and grpc-context. Those last two are the pure-Java gRPC interfaces
// that google-auth uses for its CallCredentials adapter; no transport, no Netty and no protobuf
// come with them, so the rule this project actually holds to — one HTTP stack in the JAR — is
// intact. They are NOT excluded: nothing here calls that adapter, but an exclusion that turns out
// to be wrong fails on the first transcription rather than at build time, which is the worse of the
// two failures.
//
// Pinned rather than managed: Spring Boot's BOM does not know this coordinate either.
def googleAuthVersion = '1.30.1'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    implementation("software.amazon.awssdk:s3:$awsSdkVersion") {
        // The SDK ships Netty and Apache HttpClient as its default transports. This application
        // makes a handful of small synchronous calls per photo, so it uses the JDK's own connection
        // handling instead: two fewer HTTP stacks in the JAR, and no chance of the SDK's Netty
        // arguing with the one Spring Boot manages.
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    implementation "software.amazon.awssdk:url-connection-client:$awsSdkVersion"
    implementation("com.google.auth:google-auth-library-oauth2-http:$googleAuthVersion") {
        // The same rule the AWS SDK follows: one HTTP stack in the JAR. google-http-client, which
        // this drags in, can be backed by Apache HttpClient or by the JDK's own connection
        // handling, and the JDK one is what GoogleCredentials picks by default — so the Apache jars
        // are never a code path here, only weight and a second thing to patch.
        //
        // Guava and opencensus are NOT excluded and must not be: GoogleCredentials and
        // google-http-client call into both at runtime, and a JAR that starts and then fails on the
        // first transcription is worse than one that does not build.
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
        exclude group: 'org.apache.httpcomponents', module: 'httpcore'
    }
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── Bundling the SPA into the JAR ────────────────────────────────────────────
//
// In production the frontend is served by this application, from the same origin as the API.
// That is what lets the session cookie be SameSite=Lax without any cross-site caveat, and it
// removes the possibility of a frontend and backend being deployed at versions that disagree —
// the two hand-mirror each other's contracts (ResultDTO, form-encoded POSTs, PlainUserDTO), so a
// mismatch is a real failure mode rather than a theoretical one.
//
// Opt-in, because the build otherwise needs Node installed and takes a minute longer for no
// benefit while working on the backend:
//
//     ./gradlew bootJar -Pbundle-frontend
//
ext.frontendDir = file("${projectDir}/../KindyFrontend")

tasks.register('buildFrontend', Exec) {
    onlyIf { project.hasProperty('bundle-frontend') }

    workingDir frontendDir
    // `npm ci` rather than `npm install`: it installs exactly what the lockfile pins, so the
    // artifact does not quietly change because a dependency published a new patch release.
    commandLine 'sh', '-c', 'npm ci && npm run build'

    inputs.dir("${frontendDir}/src")
    inputs.file("${frontendDir}/package-lock.json")
    inputs.file("${frontendDir}/vite.config.ts")
    outputs.dir("${frontendDir}/dist")

    doFirst {
        if (!frontendDir.exists()) {
            throw new GradleException("Frontend not found at ${frontendDir} — clone KindyFrontend next to this repo, or build without -Pbundle-frontend.")
        }
    }
}

// The build output goes to its own directory that is then registered as a resource root, rather
// than being copied straight into build/resources/main. Writing into another task's output
// directory makes the task graph ambiguous — Gradle cannot tell which of the two should run first,
// and says so rather than guessing.
tasks.register('copyFrontend', Copy) {
    onlyIf { project.hasProperty('bundle-frontend') }

    dependsOn 'buildFrontend'
    from "${frontendDir}/dist"
    into layout.buildDirectory.dir('generated-frontend/static')
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated-frontend'))

tasks.named('processResources') {
    dependsOn 'copyFrontend'
}
